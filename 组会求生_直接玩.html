<script>
/* 原创虚构剧情。全部判断来自本地游戏规则，不使用模型或外部服务。 */
window.MEETING_CONTENT = (() => {
  const choice = (text, label, effects, result, flavor, flags = {}, risk = null) => ({text,label,effects,result,flavor,flags,risk});
  const event = (id, phase, who, title, scene, quote, choices) => ({id,phase,who,title,scene,quote,choices});
  const roles = [
    {id:'newbie',icon:'🐣',name:'初来乍到',desc:'什么都不太会，但老师对你还有一点耐心。',skill:'师兄救我',skillDesc:'底气 +16 / 耐心 +10',stats:{mood:82,evidence:48,patience:65},effects:{evidence:16,patience:10},line:'你的备份文件叫“最终版”，天真得很珍贵。'},
    {id:'grinder',icon:'🦉',name:'熬夜卷王',desc:'备用幻灯片有六十页。你本人只睡了三小时。',skill:'打开隐藏附录',skillDesc:'底气 +24 / 心态 −6',stats:{mood:58,evidence:83,patience:52},effects:{evidence:24,mood:-6},line:'你知道每一个参数，却忘记了今天星期几。'},
    {id:'chill',icon:'🦥',name:'淡定摸鱼人',desc:'数据不一定漂亮，精神状态一定漂亮。',skill:'精神离线',skillDesc:'心态 +26 / 耐心 −5',stats:{mood:94,evidence:44,patience:57},effects:{mood:26,patience:-5},line:'你已经想好了，散会后去吃什么。'},
    {id:'social',icon:'🦊',name:'学术社交王',desc:'结果还在路上，人情世故已经到站。',skill:'先夸一下老师',skillDesc:'耐心 +23 / 时间 +2 / 底气 −5',stats:{mood:75,evidence:54,patience:79},effects:{patience:23,time:2,evidence:-5},line:'你掌握了“这个问题特别好”的四十二种说法。'}
  ];
  const phases = ['入场','研究背景','方法介绍','第一张图','结果解释','突发状况','灵魂追问','讨论环节','总结陈词','最后一个问题'];
  const people = {
    boss:{name:'周老师',role:'导师',icon:'👨🏻‍🏫',color:'#667d5d'},
    stats:{name:'林老师',role:'统计守门员',icon:'👩🏻‍💻',color:'#8e9e83'},
    senior:{name:'陈师兄',role:'过来人',icon:'🧑🏻‍🔬',color:'#a99c79'},
    visitor:{name:'路过的大佬',role:'恰好有空',icon:'🧔🏻',color:'#766c5f'},
    system:{name:'实验室广播',role:'命运',icon:'📢',color:'#9f9b70'}
  };
  const events = [
    event('start-screen',0,'boss','你和投影仪，只有一个能正常工作。','你的电脑屏幕正常，投影幕布上却只剩下一片蓝。所有人同时看向你。','“你先别急。大家都等着呢。”',[
      choice('拔插一下，然后假装一切尽在掌握。','稳住现场',{mood:-4,evidence:2,patience:-3,time:-2},'HDMI 人类学。','线插好了。你获得了科研人生第一个可重复的结果。'),
      choice('请师兄帮忙，先用白板讲开场。','抱紧大腿',{mood:4,patience:7,evidence:2,time:-3},'师兄的作用，大于转接头。','陈师兄抬头了。原来他一直在等你开口求救。',{help:1}),
      choice('“这是我的极简主义封面。”','现场整活',{mood:8,patience:-6,time:-1},'艺术的尽头是蓝屏。','有人笑出了声。导师决定再给你一次机会。',{chaos:1}, {chance:.32,effects:{patience:-10,mood:-6},flavor:'导师没有笑。他让你阐释一下极简主义与课题的关系。'})
    ]),
    event('start-name',0,'boss','“今天谁汇报来着？”','你坐在投影幕旁边，导师翻开笔记本。点名系统似乎尚未启动。','“小李？小王？哦，是你。”',[
      choice('报上姓名，把研究问题讲清楚。','常规开局',{evidence:6,patience:3,time:-2},'身份认证通过。','导师终于把名字写对了，后面还加了一个问号。'),
      choice('“老师，我是给您订过咖啡的那个。”','建立连接',{mood:4,patience:10,evidence:-2,time:-2},'咖啡因人脉。','他记起来了。你的名字暂时被替换成“拿铁”。',{social:1}),
      choice('“今天汇报的是一位不愿透露姓名的研究生。”','匿名参会',{mood:10,patience:-8,time:-1},'匿名审稿，实名组会。','陈师兄在桌下给你点了个赞。',{chaos:1})
    ]),
    event('start-deck',0,'senior','你的文件名，比题目更令人瞩目。','桌面投上大屏。最显眼的文件叫“组会最终版_真的最终_救命.pptx”。','“师弟，你这个版本管理体系挺有层次。”',[
      choice('淡定打开，不解释私人命名习惯。','快速翻页',{mood:-2,evidence:4,time:-1},'科研命名学。','讲台上最重要的技能之一：面不改色。'),
      choice('“这是我对工作认真负责的证据。”','重新定义',{patience:5,mood:3,time:-2},'严谨，有迹可循。','导师看了一眼修改时间：凌晨四点。他没再问。',{social:1}),
      choice('“老师，您也在最终版里。”','把梗抛回去',{mood:12,patience:-5,time:-1},'师门喜剧人。','大家开始回忆导师发过的“最新最终修改”。',{chaos:1})
    ]),
    event('background-simple',1,'boss','你精心准备的背景，被一句话截停。','你才讲到第二页，导师已经抬起了手。','“这些我们都知道。你到底要干什么？”',[
      choice('用一句话讲研究问题，直接进入正题。','直球回答',{evidence:8,patience:5,mood:-3,time:-2},'一句话，救了三页。','导师放下手。你第一次感觉到删幻灯片也能创造价值。',{rigor:1}),
      choice('“正是因为老师您看得透，我才准备得充分。”','情绪价值',{patience:10,evidence:-4,time:-3},'台阶搭得很漂亮。','导师决定让你再讲一页。真的只有一页。',{social:1}),
      choice('“简单说，我想毕业。”','坦诚到底',{mood:13,evidence:-3,patience:-4,time:-1},'共同的研究目标。','全体研究生低头，避免暴露自己的共鸣。',{chaos:1})
    ]),
    event('background-overlap',1,'visitor','隔壁组，好像也在做这个。','路过的大佬端着茶，停在了门口。茶还很烫，他暂时不打算走。','“这个题，我们前年是不是讨论过？”',[
      choice('说明自己的切入点，与已知工作区别。','守住边界',{evidence:10,patience:4,mood:-6,time:-3},'题目相似，路线不同。','大佬点头，然后拿出手机找前年那张图。',{rigor:1}),
      choice('“那我们真是站在巨人的肩膀上。”','友好建交',{patience:9,evidence:-3,time:-2},'巨人开始找座位。','你少了一个质疑，多了一位全程参会人员。',{social:1}),
      choice('“老师，这说明英雄所见略同。”','高风险嘴甜',{mood:6,patience:5,time:-1},'英雄暂时认可你。','大佬笑了。导师也笑了。你不太确定是哪种笑。',{chaos:1},{chance:.45,effects:{patience:-16,evidence:-8},flavor:'大佬认真问：“所以你认为自己也是英雄？”茶突然不烫了。'})
    ]),
    event('background-reference',1,'stats','参考文献，竟然比你还年轻。','参考文献角落里，有一篇看起来像刚刚上线的文章。','“这篇你真的看过吗？”',[
      choice('讲它解决了什么，以及没解决什么。','认真读过',{evidence:11,patience:2,mood:-4,time:-3},'原文阅读保护罩。','林老师找到了一个可交流的人。也可能只是一个新的提问对象。',{rigor:1}),
      choice('“读到方法了，细节我还需要补。”','承认进度',{patience:5,evidence:2,mood:2,time:-2},'诚实有时候很省事。','林老师让你记下下一次要看的部分。',{honest:1}),
      choice('“我和它的摘要建立了深厚感情。”','摘要派掌门',{mood:11,evidence:-7,patience:-5,time:-1},'关系止步于摘要。','陈师兄把这句话加入了实验室语录。',{chaos:1})
    ]),
    event('method-repeats',2,'stats','“你这个 n，到底是什么 n？”','激光笔停在一个很小的数字上。房间突然安静了。','“三个独立样本，还是同一个样本做了三遍？”',[
      choice('把独立样本与重复测量分开说清楚。','拆开解释',{evidence:12,patience:4,mood:-5,time:-3},'这个 n 有身份证。','林老师暂时放过了你的星号。暂时。',{rigor:1}),
      choice('“这页没写清楚，我补一张样本关系图。”','诚实补救',{evidence:4,patience:7,time:-2},'图不够，态度来凑。','导师在本子上写了“关系图”，没有写“重做”。',{honest:1}),
      choice('“n 是一种研究者的信念。”','玄学统计',{mood:13,evidence:-9,patience:-8,time:-1},'林老师的眼镜反了一下光。','你的发言已被永久收录进统计课反面笑话。',{chaos:1})
    ]),
    event('method-details',2,'boss','“为什么用这个方法？”','你已经预演过十次，唯独没有预演这一句。','“隔壁都用另一个，你想过吗？”',[
      choice('解释两种方法的取舍与适用范围。','有备而来',{evidence:10,patience:5,mood:-5,time:-3},'选择有理由。','导师说“可以”。你怀疑自己听错了。',{rigor:1}),
      choice('“师兄教我的，我先把流程跑通了。”','师门传统',{mood:4,patience:2,evidence:-3,time:-2},'传承的火焰。','师兄缓缓抬头：这不是他预期的被引用方式。',{help:1}),
      choice('“这个软件的配色比较适合我的 PPT。”','美学选型',{mood:13,evidence:-8,patience:-7,time:-1},'科研审美自由。','老师决定让你对方法与配色分别做一个对照。',{chaos:1,debt:1})
    ]),

  function applyCareer(){
    if(state.careerApplied)return;
    const key=`${state.meetingNumber}-${state.seed}`;
    if(!career.history.some(h=>h.key===key)){
      const changes={legend:10,comedian:3,diplomat:10,honest:8,debt:0,escape:3,survivor:4,mood:-5,patience:-5,overtime:-3,'cat-chair':4,'robot-union':4,recursive:2,'senior-heir':8,'field-legend':6,graduation:12};
      career.meetings++;career.experience+=10+state.choicesMade;career.totalTurns+=state.choicesMade;
      career.reputation=Math.max(0,Math.min(100,career.reputation+(changes[state.ending]||0)));
      career.debt=Math.min(3,Math.max(0,state.flags.debt-(state.flags.rigor>=4?2:state.flags.honest>=4?1:0)));
      const earned=state.stats.mood>0&&state.stats.patience>0?3:1;
      career.coins+=earned;state.coinsEarned=earned;career.relations={...state.relations};
      career.recentEvents=[...career.recentEvents,...state.seen].slice(-35);
      career.history.push({key,ending:state.ending,rounds:state.choicesMade,project:state.project});
      write(CAREER,career);
    }
    state.careerApplied=true;save();
  }
  function ending(){applyCareer();const end=C.endings.find(e=>e.id===state.ending),role=C.roles.find(r=>r.id===state.role);let isNew=!album.some(x=>x.id===end.id);const mark=album.find(x=>x.id===end.id);const score=E.score(state);if(!mark){album.push({id:end.id,score});write(ALBUM,album);}else if(score>mark.score){mark.score=score;write(ALBUM,album);}updateAlbumCount();
    const comic=state.log.findLast(r=>r.type==='choice'&&C.events.find(e=>e.id===r.eventId)?.choices.some(c=>c.text===r.answer&&c.flags.chaos));
    const last=state.log.filter(r=>r.type==='choice').at(-1);
    app.innerHTML=`<div class="ending-layout"><article class="ending-card" id="ending-card"><p class="eyebrow">ROOM 404 / 本场求生报告</p>${isNew?'<span class="new-ending">✦ 解锁新结局</span>':'<span class="new-ending">再次抵达这个结局</span>'}<span class="ending-icon">${end.icon}</span><h1>${end.title}</h1><p class="subtitle">${end.subtitle}</p><p class="ending-copy">${end.desc}</p><div class="ending-stats"><div><small>本场评分</small><strong>${score}<small style="display:inline"> /100</small></strong></div><div><small>撑过回合</small><strong>${state.choicesMade}<small style="display:inline"> 回合</small></strong></div><div><small>整活次数</small><strong>${state.flags.chaos}</strong></div></div><div class="ending-sign"><span>${escape(state.name)} / ${role.name}</span><span>组会求生 · ${String(state.seed).slice(-6)}</span></div></article><section class="post-game"><p class="eyebrow">THE MEETING IS OVER. PROBABLY.</p><h2>散会之后，你留下了什么？</h2><p>第 ${state.meetingNumber} 场组会结束。你${state.flags.rigor>=4?'认真守住了自己的结论':state.flags.chaos>=4?'贡献了大量精神娱乐':state.flags.social>=3?'展示了成熟的人情世故':'试着把每个问题接住'}。<br>本场获得 ${10+state.choicesMade} 点经验。摸鱼币 +${state.coinsEarned||0}。下一场，老师还记得你。</p><div class="highlights"><div class="highlight"><small>全场名场面</small><p>${escape(comic?.answer||last?.answer||'你勇敢地走进了会议室。')}</p></div><div class="highlight"><small>散会时的你</small><p>心态 ${state.stats.mood} · 底气 ${state.stats.evidence} · 导师耐心 ${state.stats.patience}</p></div><div class="highlight"><small>导师的小本本</small><p>${state.flags.debt?`还记着 ${state.flags.debt} 笔“下周再说”。祝下周的你好运。`:'今天的坑，今天填。导师暂时没记下新的解释债。'}</p></div></div><div class="end-actions"><button id="continue-career" class="primary">去看看散会后的生活 <span>↗</span></button><button id="replay" class="secondary">换个人设</button><button id="download" class="secondary">保存结局卡</button><button id="copy" class="secondary">复制战绩</button></div><p class="muted">已参加 ${career.meetings} 场 · 生涯经验 ${career.experience} · ${careerRank()}。结局收藏 ${new Set(album.map(a=>a.id)).size}/${C.endings.length}。</p></section></div><div class="end-journal">${journal()}</div>`;
    $('#continue-career').onclick=()=>{selectedRole=state.role;difficulty=state.difficulty;playerName=state.name;selectedProject=state.project;selectedPersona=state.personaMode||'random';renderBreak();};
    $('#replay').onclick=()=>{selectedRole=state.role;selectedProject=state.project;playerName=state.name;play();landing();scrollTop();};
    $('#download').onclick=exportCard;
    $('#copy').onclick=async()=>{const text=`我在《组会求生》里解锁了「${end.title}」${end.icon}\n${end.subtitle}\n角色：${role.name} · 撑过 ${state.choicesMade} 回合 · 评分 ${score}/100\n名场面：${comic?.answer||last?.answer||'我走进了会议室'}\n你能活着散会吗？`;try{await navigator.clipboard.writeText(text);toast('战绩已复制，可以发给朋友。');}catch{const area=document.createElement('textarea');area.value=text;document.body.append(area);area.select();const ok=document.execCommand('copy');area.remove();toast(ok?'战绩已复制。':'此浏览器未允许复制，请保存结局卡。');}};
    if(isNew)play('ending');scrollTop();
  }
  function wrapText(ctx,text,x,y,maxWidth,lineHeight,maxLines=100){let line='',lines=0;for(const ch of text){if(ctx.measureText(line+ch).width>maxWidth&&line){ctx.fillText(line,x,y);y+=lineHeight;line=ch;lines++;if(lines>=maxLines)return y;}else line+=ch;}if(line)ctx.fillText(line,x,y);return y+lineHeight;}
  function exportCard(){const end=C.endings.find(e=>e.id===state.ending),role=C.roles.find(r=>r.id===state.role),canvas=document.createElement('canvas');canvas.width=1000;canvas.height=1280;const ctx=canvas.getContext('2d');ctx.fillStyle='#f5f2e9';ctx.fillRect(0,0,1000,1280);ctx.fillStyle='#183d35';ctx.fillRect(50,50,900,1180);ctx.fillStyle='#adc5b3';ctx.font='22px Microsoft YaHei, sans-serif';ctx.fillText('组会求生 / ROOM 404',100,125);ctx.strokeStyle='#ffffff30';ctx.beginPath();ctx.moveTo(100,160);ctx.lineTo(900,160);ctx.stroke();ctx.font='104px Segoe UI Emoji, sans-serif';ctx.fillText(end.icon,100,305);ctx.fillStyle='#f5f2e9';ctx.font='bold 66px Microsoft YaHei, sans-serif';let y=wrapText(ctx,end.title,100,405,800,85);ctx.fillStyle='#f1cc62';ctx.font='27px Microsoft YaHei, sans-serif';y=wrapText(ctx,end.subtitle,100,y+25,800,44);ctx.fillStyle='#d0ddce';ctx.font='29px Microsoft YaHei, sans-serif';y=wrapText(ctx,end.desc,100,y+43,800,54);ctx.strokeStyle='#ffffff30';ctx.beginPath();ctx.moveTo(100,920);ctx.lineTo(900,920);ctx.stroke();ctx.fillStyle='#adc5b3';ctx.font='24px Microsoft YaHei, sans-serif';ctx.fillText('本场评分',100,975);ctx.fillText('撑过回合',390,975);ctx.fillText('整活次数',680,975);ctx.fillStyle='#f5f2e9';ctx.font='bold 54px Consolas, sans-serif';ctx.fillText(`${E.score(state)}/100`,100,1045);ctx.fillText(`${state.choicesMade}`,390,1045);ctx.fillText(String(state.flags.chaos),680,1045);ctx.fillStyle='#adc5b3';ctx.font='24px Microsoft YaHei, sans-serif';ctx.fillText(`${state.name} / ${role.name}`,100,1140);ctx.fillText('你能活着散会吗？',100,1180);const imageUrl=canvas.toDataURL('image/png');$('#card-image').src=imageUrl;$('#card-modal').showModal();$('#save-card-image').onclick=()=>{const a=document.createElement('a');a.href=imageUrl;a.download=`组会求生_${end.title}.png`;a.click();toast('已发起下载；也可以直接保存预览图片。');};}
  function showAlbum(){updateAlbumCount();$('#album-grid').innerHTML=C.endings.map(e=>{const known=album.find(a=>a.id===e.id);return `<article class="album-card ${known?'':'locked'}"><span class="album-icon">${known?e.icon:'🔒'}</span><div><strong>${known?e.title:'未解锁结局'}</strong><small>${known?`最佳评分 ${known.score}/100 · ${e.subtitle}`:e.hint}</small></div></article>`;}).join('');$('#album').showModal();}
  $('#shop').onclick=showShop;
  $('#close-shop').onclick=()=>$('#shop-modal').close();
  $('#close-card').onclick=()=>$('#card-modal').close();
  $('#collection').onclick=showAlbum;
  $('#close-album').onclick=()=>$('#album').close();
  $('#album').onclick=e=>{if(e.target===$('#album')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}};
  $('#sound').textContent=`音效 ${soundOn?'开':'关'}`;$('#sound').setAttribute('aria-pressed',String(soundOn));
  $('#sound').onclick=()=>{soundOn=!soundOn;write(SETTINGS,{sound:soundOn});$('#sound').textContent=`音效 ${soundOn?'开':'关'}`;$('#sound').setAttribute('aria-pressed',String(soundOn));play('item');};
  $('#brand').onclick=e=>{e.preventDefault();if(state)save();landing();scrollTop();};
  document.addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.altKey||e.metaKey||['INPUT','TEXTAREA','BUTTON','SUMMARY'].includes(document.activeElement?.tagName)||$('#album').open||$('#card-modal').open||$('#shop-modal').open)return;if(!state||state.ended)return;if(['1','2','3'].includes(e.key)&&!state.pending){app.querySelector(`[data-choice="${Number(e.key)-1}"]`)?.click();}else if(e.key==='Enter'&&state.pending){$('#next')?.click();}});
  landing();
})();

</script>
