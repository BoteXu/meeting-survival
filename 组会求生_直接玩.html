<script>
(() => {

    }else if(week.status==='meeting'){
      const ctx=W.meetingContext(week);body=`<section class="life-scene"><p class="eyebrow">FRIDAY / 准备进入会议室</p><span class="life-icon">🎤</span><h1>这一周，现在轮到你讲了。</h1><p>你的准备、熬夜、合作和承诺，会一起走上讲台。</p><div class="week-context">本周最终入场修正：心态 ${ctx.deltas.mood>=0?'+':''}${ctx.deltas.mood} · 底气 ${ctx.deltas.evidence>=0?'+':''}${ctx.deltas.evidence} · 时间 ${ctx.deltas.time} min<br>额外解释债 ${ctx.debt} 笔。${ctx.deltas.patience?`耐心修正 ${ctx.deltas.patience>0?'+':''}${ctx.deltas.patience}。`:''}角色、难度、导师风格也会影响初始状态。</div></section><section class="life-options"><button class="primary" id="enter-friday">进入周五组会 ↗</button><p class="week-hint">组会仍然不限十回合。失败后也继续过周末，下一周还能再来。</p><details class="week-history"><summary>回看本周入场前的选择</summary>${week.log.map(r=>`<p>${C.weekDays[r.day]} · ${esc(r.answer)}</p>`).join('')}</details></section>`;
    }else{
      body=`<section class="life-scene"><p class="eyebrow">SUNDAY / 本周生活报告</p><span class="life-icon">📒</span><h1>一周结束，故事还开着。</h1><p>${esc(week.config.name)}，这周你做了 ${week.log.length} 次日常选择。${week.meeting?`周五解锁「${esc(week.meeting.title)}」。`:'组会记录暂未生成。'}</p><div class="week-context">${week.meeting?kinds[week.meeting.kind]+' · 本场评分 '+week.meeting.score+'/100':''}<br>未完成 ${week.tasks.filter(t=>!t.done).length} 件事，会进入下一周；处理过的任务保持完成。</div></section><section class="life-options"><button class="primary" id="next-week">继续第 ${week.number+1} 周 ↗</button><button class="secondary" id="week-config">回门口换个学科 / 人设</button><details class="week-history"><summary>这一周的生活轨迹</summary>${week.log.map(r=>`<p><small>${C.weekDays[r.day]}</small> ${esc(r.answer)}${r.taskDone?' ✓ 已处理一项遗留':''}</p>`).join('')}</details></section>`;
    }
    app.innerHTML=`<div class="run-head"><div><p class="eyebrow">WEEK ${week.number} / ${p.icon} ${p.name}</p><h2>${esc(week.config.name)}的一周</h2></div><button class="plain" id="week-door">回到门口 · 自动保存</button></div>${calendar()}${resources()}<div class="week-board">${body}</div>${tasks()}<div class="week-bottom"><button class="secondary" id="life-shop">逛逛补给站</button><small>游戏中的一周不跟随现实时间。随时停下，下次接着过。</small></div>`;
    if(!window.MEETING_CAMPUS?.enabled(week)){const notice=document.createElement('p');notice.className='week-hint';notice.textContent='当前旧周历会保留进度；从下一周开始，开放校园探索、课题养成与手牌。';app.querySelector('.week-board').before(notice);}
    window.MEETING_CAMPUS_UI?.decorate(week,render,save);window.MEETING_PREPARATION_UI?.decorateWeek(week,render,save);window.MEETING_LIFE_SURPRISES?.decorate(week,render,save);
    app.querySelectorAll('[data-life]').forEach(b=>b.onclick=()=>{const r=W.choose(week,Number(b.dataset.life));if(!r)return;careerEffects(r);save();render();});
    if($('#life-next'))$('#life-next').onclick=()=>{if(W.advance(week)){save();render();if(week.campus){const target=week.status==='life'?($('.preparation-board')||$('.campus-map')):week.status==='meeting'?$('.deck-board'):$('.campus-report');target?.scrollIntoView({block:'start',behavior:'smooth'});}}};
    if($('#enter-friday'))$('#enter-friday').onclick=()=>{if(!A.restoreMeeting(week.id)){if(week.campus)week.campus.deckLocked=true;save();A.startWith(week.config,W.meetingContext(week));}};
    if($('#next-week'))$('#next-week').onclick=()=>{if(!week.reportApplied){const career=A.getCareer();career.weeks=Math.max(career.weeks||0,week.number);week.reportApplied=true;A.persistCareer();save();}week=W.create({...week.config,campus:true,preparation:true,peer:A.getCareer().peer,relations:{...A.getCareer().relations}},seed(),week,week.number+1);save();render();window.scrollTo(0,0);};
    if($('#week-config'))$('#week-config').onclick=A.landing;$('#week-door').onclick=A.landing;$('#life-shop').onclick=A.showShop;
  }
  function resume(id){if(!week||(id&&id!==week.id))return false;if(week.status==='meeting'&&A.restoreMeeting(week.id))return true;render();window.scrollTo(0,0);return true;}
  function enhanceLanding(){const start=$('#start');if(!start)return;
    const copy=$('.hero-copy');copy.innerHTML='这周怎么准备，周五就怎么回答。<br>准备决定你能讲什么，现场决定对方买不买账。漏洞、连续追问和关系波动，每场重新面对。';
    const head=$('.discipline-head');const filters=document.createElement('div');filters.className='family-filter';filters.setAttribute('aria-label','按学科门类筛选');filters.innerHTML=[{id:'all',name:'全部 · 36条路线'},...C.families].map(f=>`<button data-family="${f.id}" class="${family===f.id?'active':''}">${f.name}</button>`).join('');head.after(filters);
    const filter=()=>{app.querySelectorAll('[data-project]').forEach(b=>b.hidden=family!=='all'&&C.projects.find(p=>p.id===b.dataset.project).family!==family);filters.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.family===family));};filters.querySelectorAll('button').forEach(b=>b.onclick=()=>{family=b.dataset.family;filter();});filter();
    start.textContent='开始新的一周 ↗';start.onclick=()=>{if(week&&week.status!=='report'){A.toast('这一周还没过完，先继续当前一周；结束后可以换配置。');resume();return;}const number=Math.max(A.getCareer().weeks||0,week?.number||0)+1;week=W.create({...A.getMenuConfig(),campus:true,preparation:true,peer:A.getCareer().peer,relations:{...A.getCareer().relations}},seed(),week,number);save();render();window.scrollTo(0,0);};
    const quick=document.createElement('button');quick.className='secondary';quick.id='quick-meeting';quick.textContent='只玩一场组会';quick.onclick=()=>{if(week&&week.status!=='report'){A.toast('请先完成当前一周，避免覆盖周五的组会记录。');return;}A.startWith(A.getMenuConfig());};start.before(quick);
    if(week){const btn=document.createElement('button');btn.className='primary';btn.id='resume-week';btn.textContent=`继续第${week.number}周 · ${C.weekDays[week.day]}`;btn.onclick=()=>resume();start.before(btn);}
    if($('#resume')&&week&&week.status!=='report')$('#resume').onclick=()=>resume();
  }
  function decorateMeeting(s){const ctx=s.weekContext;if(!ctx||$('.meeting-week-link'))return;const strip=document.createElement('div');strip.className='meeting-week-link';strip.innerHTML=`📅 第${ctx.number}周 · 周五组会 <span>生活与准备带来的心态 ${ctx.deltas.mood>=0?'+':''}${ctx.deltas.mood} / 底气 ${ctx.deltas.evidence>=0?'+':''}${ctx.deltas.evidence} / 时间 ${ctx.deltas.time} min</span><details><summary>这些修正来自我的哪些选择？</summary>${ctx.sourceActions.map(r=>`<p>${C.weekDays[r.day]} · ${esc(r.answer)}</p>`).join('')}</details>`;if(ctx.campus){const info=document.createElement('div');info.className='campus-meeting-cards';info.innerHTML=ctx.campus.deck.map(id=>{const c=C.workCards.find(c=>c.id===id);return `<span>${c.icon} ${c.name}</span>`;}).join('')+ctx.campus.combos.map(x=>`<span>✦ ${x}</span>`).join('');strip.append(info);}$('.run-head').after(strip);}
  window.MEETING_WEEK_UI={resume,enhanceLanding,decorateMeeting,onMeetingEnded:s=>{if(week&&W.completeMeeting(week,s))save();}};
  const showAlbum=$('#collection').onclick;$('#collection').onclick=()=>{showAlbum();let bar=$('#ending-filters');if(bar)bar.remove();bar=document.createElement('div');bar.id='ending-filters';bar.className='family-filter';bar.innerHTML=[['all','全部'],...Object.entries(kinds)].map(([id,name])=>`<button data-kind="${id}">${name} · ${C.endings.filter(e=>id==='all'||e.kind===id).length}</button>`).join('');$('#album-grid').before(bar);bar.querySelectorAll('button').forEach(b=>b.onclick=()=>{$('#album-grid').querySelectorAll('.album-card').forEach((card,i)=>card.hidden=b.dataset.kind!=='all'&&C.endings[i].kind!==b.dataset.kind);bar.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));});bar.querySelector('button').classList.add('active');};
  $('#calendar').onclick=()=>{if(!resume())A.toast('在门口选好学科，开始新的一周。');};
  document.addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.altKey||e.metaKey||['INPUT','TEXTAREA','BUTTON','SELECT','SUMMARY'].includes(document.activeElement?.tagName)||document.querySelector('dialog[open]')||A.getState()||!week)return;if(['1','2','3'].includes(e.key))app.querySelector(`[data-life="${Number(e.key)-1}"]`)?.click();if(e.key==='Enter')$('#life-next')?.click();});
  enhanceLanding();
})();

</script>
</body>
</html>
