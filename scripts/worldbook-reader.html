<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>组会求生 · 世界设定与校园故事</title><style>
:root{color-scheme:light;--ink:#203328;--muted:#526358;--paper:#faf8f2;--line:#cdd6cc;--accent:#245238}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:system-ui,"Microsoft YaHei",sans-serif;font-size:16px}header{padding:28px max(20px,calc((100vw - 1320px)/2));background:#e5edde;border-bottom:1px solid var(--line)}header h1{font-size:clamp(24px,4vw,38px);margin:0 0 12px}header p{margin:8px 0;line-height:1.7;max-width:980px}summary{cursor:pointer;font-weight:600}button,input,select{font:inherit}button,select,input{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:white;color:var(--ink)}button{cursor:pointer}button:hover,button[aria-pressed=true]{background:#dce9d6;border-color:#54745a}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #267b9a;outline-offset:2px}button:disabled{cursor:default;opacity:.5}label{display:flex;gap:8px;align-items:center}main{max-width:1360px;margin:auto;padding:24px;display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px}aside{min-width:0}.filters{display:grid;gap:10px;margin-bottom:16px}.filters label{white-space:nowrap}.filters input,.filters select{width:100%;min-width:0}.tabs{display:flex;gap:8px}.tabs button{flex:1}.catalogue{display:grid;gap:7px;max-height:70vh;overflow:auto;padding:3px}.catalogue button{text-align:left;line-height:1.55}.catalogue small{display:block;color:var(--muted)}.pager{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:14px}article{background:white;border:1px solid var(--line);border-radius:16px;padding:clamp(20px,4vw,48px);min-width:0}article h2{font-size:clamp(23px,3vw,30px);line-height:1.5;margin:0 0 14px}.reading-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.95;max-width:760px;font-size:17px}.meta{color:var(--muted);font-size:14px;margin-bottom:24px}.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}a{color:#195937}footer{padding:24px;text-align:center;color:var(--muted)}@media(max-width:760px){main{display:block;padding:14px}aside{margin-bottom:20px}.catalogue{max-height:250px}article{padding:22px 18px}.reading-text{font-size:16px}header{padding:22px 18px}}
</style></head><body><header><h1>世界设定与校园故事</h1><p id="statistics"></p><details><summary>编写方式、计数与故事边界</summary><p id="method"></p><p id="counting"></p><p>小说按人物分为学年短篇，与百科共享姓名、学校、学科和合作人。故事中的学生和事件属于独立分支，不能当作游戏存档中已经完成的成果。所有机构与人物均为虚构。</p></details></header><main><aside><div class="filters"><div class="tabs"><button id="encyclopedia">设定百科</button><button id="novel">校园小说</button></div><label>学科<select id="family"><option value="all">全部门类</option><option value="core">共同世界</option></select></label><label>查找<input id="search" placeholder="导师、方向、学校或条目" type="search"></label></div><div id="catalogue" class="catalogue" aria-label="章节目录"></div><div class="pager"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div></aside><article aria-live="polite"><h2 id="title"></h2><p class="meta" id="meta"></p><div class="reading-text" id="text"></div><div class="links" id="links"></div></article></main><footer>组会求生 v0.14.0 · 可下载本页，离线阅读；阅读不会修改游戏存档。</footer><script>
const DATA=/*__WORLDBOOK_DATA__*/;
const $=id=>document.getElementById(id),m=DATA.manifest;let kind='encyclopedia',page=0,current=DATA.chapters[0].id;
$('statistics').textContent=`正文 ${m.chineseCharacters.toLocaleString()} 汉字 · 百科 ${(m.encyclopediaShare*100).toFixed(1)}% / 小说 ${((1-m.encyclopediaShare)*100).toFixed(1)}% · ${m.mentorProfiles.toLocaleString()} 位导师 · ${m.volumes.length} 册`;
$('method').textContent=m.method;$('counting').textContent=m.counting+` 去重段落正文 ${m.distinctBodyCharacters.toLocaleString()} 汉字；相近的按人物改写段落仍在去重统计内。`;
for(const [id,name] of Object.entries(DATA.familyNames)){const o=document.createElement('option');o.value=id;o.textContent=name;$('family').append(o);}
function read(id){const c=DATA.chapters.find(x=>x.id===id);if(!c)return;current=id;kind=c.kind;$('title').textContent=c.title;$('meta').textContent=`${c.kind==='novel'?'校园小说':'设定百科'} · ${DATA.familyNames[c.family]||'共同世界'} · ${c.chineseCharacters.toLocaleString()} 汉字`;$('text').textContent=c.text;$('links').replaceChildren();if(c.mentor){const counterpart=DATA.chapters.find(x=>x.mentor===c.mentor&&x.kind!==c.kind);const b=document.createElement('button');b.textContent=c.kind==='novel'?'查看这个人物的百科档案':'阅读这个团队的学年故事';b.onclick=()=>{page=0;read(counterpart.id);render();$('title').scrollIntoView({block:'start'});};$('links').append(b);}history.replaceState(null,'','#'+encodeURIComponent(id));}
function render(){const q=$('search').value.trim().toLowerCase(),f=$('family').value;const list=DATA.chapters.filter(c=>c.kind===kind&&(f==='all'||c.family===f)&&(!q||(c.title+' '+c.text.slice(0,650)).toLowerCase().includes(q)));page=Math.min(page,Math.max(0,Math.ceil(list.length/24)-1));$('catalogue').replaceChildren();for(const c of list.slice(page*24,(page+1)*24)){const b=document.createElement('button');b.textContent=c.title;b.setAttribute('aria-pressed',String(c.id===current));b.onclick=()=>{read(c.id);render();};$('catalogue').append(b);}if(!list.length)$('catalogue').textContent='没有匹配条目，试试其他关键词。';$('page').textContent=`${page+1} / ${Math.max(1,Math.ceil(list.length/24))} · ${list.length} 条`;$('prev').disabled=page===0;$('next').disabled=(page+1)*24>=list.length;for(const k of ['encyclopedia','novel'])$(k).setAttribute('aria-pressed',String(kind===k));}
for(const k of ['encyclopedia','novel'])$(k).onclick=()=>{kind=k;page=0;const c=DATA.chapters.find(x=>x.kind===kind&&($('family').value==='all'||x.family===$('family').value));if(c)read(c.id);render();};$('search').oninput=()=>{page=0;render();};$('family').onchange=()=>{page=0;render();};$('prev').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};read(decodeURIComponent(location.hash.slice(1))||current);render();
</script></body></html>
